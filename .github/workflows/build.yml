name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # LNB Warden and MineVegas Casino are not in any Maven repository and are never committed.
      # Set the WARDEN_JAR_URL and MINEVEGAS_JAR_URL secrets to download them. Without them, the build is skipped.
      - name: Download mod jars
        id: jars
        env:
          WARDEN_JAR_URL: ${{ secrets.WARDEN_JAR_URL }}
          MINEVEGAS_JAR_URL: ${{ secrets.MINEVEGAS_JAR_URL }}
        run: |
          if [ -z "$WARDEN_JAR_URL" ] || [ -z "$MINEVEGAS_JAR_URL" ]; then
            echo "WARDEN_JAR_URL or MINEVEGAS_JAR_URL is not set: skipping the build."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p libs
          curl -fsSL "$WARDEN_JAR_URL" -o libs/lnbwarden.jar
          curl -fsSL "$MINEVEGAS_JAR_URL" -o libs/minevegas-casino.jar
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build and test
        if: steps.jars.outputs.available == 'true'
        run: ./gradlew build
