org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
# Kotlin for Forge already provides the Kotlin stdlib at runtime.
kotlin.stdlib.default.dependency=false

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Built against the NeoForge of the test instance; any NeoForge from 21.1.264 (LNB Warden's) works.
neo_version=21.1.265
neo_version_range=[21.1.264,)
loader_version_range=[5.12,)
kff_version=5.12.0

# GeckoLib (required): animated block models, like the counter and its teller.
geckolib_version=4.9.3
geckolib_version_range=[4.9,)

# LNB Warden (required) and MineVegas Casino (optional), resolved from jars in libs/ (see README).
lnbwarden_version_range=[0.1.0,)
minevegas_version_range=[1.1.1,1.2)

mod_id=lnbeconomy
mod_name=LNB Economy
mod_license=AGPL-3.0-or-later
mod_version=0.2.1
mod_group_id=fr.bde_teknantes.lnb.economy
mod_authors=Dimitri Collineau
mod_description=LNBits in game: balances, payments and casino chips, backed by LNB's site.
